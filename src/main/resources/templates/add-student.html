<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Add Student</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="card">
      <h2>Add Student</h2>
      <form
        th:action="@{/teacher/add-student}"
        th:object="${student}"
        method="post"
      >
        <input
          type="text"
          th:field="*{username}"
          placeholder="Username"
          required
        />
        <input
          type="password"
          th:field="*{password}"
          placeholder="Password"
          required
        />
        <button type="submit">Add Student</button>
      </form>
      <a href="/teacher/students">⬅ Back</a>
    </div>
  </body>
</html>
