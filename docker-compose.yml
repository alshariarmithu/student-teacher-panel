services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: student_teacher_db
      MYSQL_ROOT_PASSWORD: 2107066
    ports:
      - "3308:3306"

  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/student_teacher_db
    depends_on:
      - db